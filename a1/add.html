<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title shown in the browser tab -->
    <title>BookVerse | Add Book</title>

    <!-- Bootstrap CSS framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts used throughout the website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap"
          rel="stylesheet">

    <!-- Material Icons used for website icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- Custom BookVerse stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ==================== HEADER & NAVIGATION ==================== -->

    <header>
        <nav class="navbar navbar-expand-lg">

            <!-- Bootstrap container keeps the navigation content aligned -->
            <div class="container">

                <!-- BookVerse logo and link back to homepage -->
                <a class="navbar-brand" href="index.html">
                    <span class="material-icons">menu_book</span>
                    BookVerse
                </a>

                <!-- Button used to open/close the navigation menu on smaller screens -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation"
                        aria-controls="mainNavigation"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapsible navigation menu -->
                <div class="collapse navbar-collapse" id="mainNavigation">

                    <!-- Navigation links -->
                    <ul class="navbar-nav ms-auto">

                        <!-- Home page -->
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <!-- Books page -->
                        <li class="nav-item">
                            <a class="nav-link" href="books.html">
                                Books
                            </a>
                        </li>

                        <!-- Gallery page -->
                        <li class="nav-item">
                            <a class="nav-link" href="gallery.html">
                                Gallery
                            </a>
                        </li>

                        <!-- Current page is highlighted as active -->
                        <li class="nav-item">
                            <a class="nav-link active" href="add.html">
                                Add Book
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>
    </header>


    <!-- ==================== MAIN CONTENT ==================== -->

    <main>

        <section class="container py-5">

            <!-- Page heading -->
            <div class="mb-4">

                <h1>
                    <span class="material-icons text-success align-middle">
                        add_box
                    </span>
                    Add New Book
                </h1>

            </div>


            <!-- Centre the form horizontally -->
            <div class="row justify-content-center">

                <!-- Form takes full width on small screens and 8 columns on large screens -->
                <div class="col-12 col-lg-9">

                    <!-- Add Book form -->
                    <form id="addBookForm" class="form-container p-4 rounded">


                        <!-- ==================== BOOK TITLE & AUTHOR ==================== -->

                        <div class="row">

                            <!-- Book Title -->
                            <div class="col-md-6 mb-3">

                                <label for="title" class="form-label">
                                    Book Title
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="title"
                                       name="title"
                                       placeholder="Enter book title"
                                       required>

                            </div>


                            <!-- Author Name -->
                            <div class="col-md-6 mb-3">

                                <label for="author" class="form-label">
                                    Author Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="author"
                                       name="author"
                                       placeholder="Enter author name"
                                       required>

                            </div>

                        </div>


                        <!-- ==================== GENRE ==================== -->

                        <div class="mb-3">

                            <label for="genre" class="form-label">
                                Genre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="genre"
                                   name="genre"
                                   placeholder="Enter book genre"
                                   required>

                        </div>


                        <!-- ==================== PUBLICATION YEAR & PRICE ==================== -->

                        <div class="row">

                            <!-- Publication Year -->
                            <div class="col-md-6 mb-3">

                                <label for="publication_year" class="form-label">
                                    Publication Year
                                </label>

                                <input type="number"
                                       class="form-control"
                                       id="publication_year"
                                       name="publication_year"
                                       placeholder="2024"
                                       required>

                            </div>


                            <!-- Price -->
                            <div class="col-md-6 mb-3">

                                <label for="price" class="form-label">
                                    Price ($)
                                </label>

                                <input type="number"
                                       class="form-control"
                                       id="price"
                                       name="price"
                                       placeholder="19.99"
                                       min="0"
                                       step="0.01"
                                       required>

                            </div>

                        </div>


                        <!-- ==================== ISBN & BOOK CONDITION ==================== -->

                        <div class="row">

                            <!-- ISBN -->
                            <div class="col-md-6 mb-3">

                                <label for="isbn" class="form-label">
                                    ISBN
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="isbn"
                                       name="isbn"
                                       placeholder="978-1-234567-89-0"
                                       required>

                            </div>


                            <!-- Book Condition -->
                            <div class="col-md-6 mb-3">

                                <label for="book_condition" class="form-label">
                                    Book Condition
                                </label>

                                <select class="form-select"
                                        id="book_condition"
                                        name="book_condition"
                                        required>

                                    <option value="" selected disabled>
                                        Select condition
                                    </option>

                                    <option value="New">
                                        New
                                    </option>

                                    <option value="Gently Used">
                                        Gently Used
                                    </option>

                                    <option value="Fair">
                                        Fair
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- ==================== DESCRIPTION ==================== -->

                        <div class="mb-3">

                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="5"
                                      placeholder="Enter a description of the book"
                                      required></textarea>

                        </div>


                        <!-- ==================== COVER IMAGE ==================== -->

                        <div class="mb-3">

                            <label for="image_path" class="form-label">
                                Upload Cover Image
                            </label>

                            <input type="file"
                                   class="form-control"
                                   id="image_path"
                                   name="image_path"
                                   accept=".jpg,.jpeg,.png,.gif,.webp"
                                   required>

                            <div class="form-text">
                                Accepted image types: JPG, JPEG, PNG, GIF and WEBP.
                            </div>

                        </div>


                        <!-- ==================== IMAGE PREVIEW ==================== -->

                        <div class="mb-4 text-center">

                            <img id="imagePreview"
                                 src=""
                                 alt="Selected book cover preview"
                                 class="img-fluid image-preview d-none">

                        </div>


                        <!-- ==================== AVAILABILITY STATUS ==================== -->

                        <div class="mb-3">

                            <label for="status" class="form-label">
                                Availability Status
                            </label>

                            <select class="form-select"
                                    id="status"
                                    name="status"
                                    required>

                                <option value="" selected disabled>
                                    Select status
                                </option>

                                <option value="Available">
                                    Available
                                </option>

                                <option value="Reserved">
                                    Reserved
                                </option>

                                <option value="Sold">
                                    Sold
                                </option>

                            </select>

                        </div>


                        <!-- ==================== AGREEMENT ==================== -->

                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="agree"
                                   name="agree"
                                   required>

                            <label class="form-check-label"
                                   for="agree">

                                I agree that this book information is accurate and complete

                            </label>

                        </div>


                        <!-- ==================== SUBMIT BUTTON ==================== -->

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">

                                <span class="material-icons align-middle">
                                    library_add
                                </span>

                                Add Book to Collection

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <footer class="py-4 mt-5">

        <div class="container text-center">

            <p class="mb-0">
                &copy; 2026 BookVerse. All rights reserved.
            </p>

            <p class="mb-0">
                Created by Oliver Heberle
            </p>

        </div>

    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

    <!-- Bootstrap JavaScript bundle provides components such as the mobile navbar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript for form validation and image preview -->
    <script src="assets/js/scripts.js"></script>

</body>

</html>
