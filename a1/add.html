<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookVerse | Add Book</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap"
          rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">

                <a class="navbar-brand" href="index.html">
                    <span class="material-icons">menu_book</span>
                    BookVerse
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation"
                        aria-controls="mainNavigation"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="books.html">
                                Books
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="gallery.html">
                                Gallery
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="add.html">
                                Add Book
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <section class="container py-5">

            <div class="text-center mb-5">
                <h1>Add a Book</h1>
                <p>Add a new book to the BookVerse collection.</p>
            </div>

            <div class="row justify-content-center">

                <div class="col-12 col-lg-8">

                    <form id="addBookForm">

                        <!-- Book Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Book Title
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   name="title"
                                   placeholder="Enter the book title"
                                   required>
                        </div>

                        <!-- Author -->
                        <div class="mb-3">
                            <label for="author" class="form-label">
                                Author Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="author"
                                   name="author"
                                   placeholder="Enter the author's name"
                                   required>
                        </div>

                        <!-- Genre -->
                        <div class="mb-3">
                            <label for="genre" class="form-label">
                                Genre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="genre"
                                   name="genre"
                                   placeholder="Enter the book genre"
                                   required>
                        </div>

                        <!-- Publication Year -->
                        <div class="mb-3">
                            <label for="publication_year" class="form-label">
                                Publication Year
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="publication_year"
                                   name="publication_year"
                                   placeholder="Enter the publication year"
                                   required>
                        </div>

                        <!-- ISBN -->
                        <div class="mb-3">
                            <label for="isbn" class="form-label">
                                ISBN
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="isbn"
                                   name="isbn"
                                   placeholder="Enter the ISBN"
                                   required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="5"
                                      placeholder="Enter a description of the book"
                                      required></textarea>
                        </div>

                        <!-- Book Condition -->
                        <div class="mb-3">
                            <label for="book_condition" class="form-label">
                                Book Condition
                            </label>

                            <select class="form-select"
                                    id="book_condition"
                                    name="book_condition"
                                    required>

                                <option value="" selected disabled>
                                    Select book condition
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Gently Used">
                                    Gently Used
                                </option>

                                <option value="Fair">
                                    Fair
                                </option>

                            </select>
                        </div>

                        <!-- Price -->
                        <div class="mb-3">
                            <label for="price" class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   name="price"
                                   placeholder="Enter the price"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                        <!-- Cover Image -->
                        <div class="mb-3">
                            <label for="image_path" class="form-label">
                                Upload Cover Image
                            </label>

                            <input type="file"
                                   class="form-control"
                                   id="image_path"
                                   name="image_path"
                                   accept=".jpg,.jpeg,.png,.gif,.webp"
                                   required>

                            <div class="form-text">
                                Accepted image types: JPG, JPEG, PNG, GIF and WEBP.
                            </div>
                        </div>

                        <!-- Image Preview -->
                        <div class="mb-4 text-center">
                            <img id="imagePreview"
                                 src=""
                                 alt="Selected book cover preview"
                                 class="img-fluid d-none"
                                 style="max-height: 300px;">
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label for="status" class="form-label">
                                Status
                            </label>

                            <select class="form-select"
                                    id="status"
                                    name="status"
                                    required>

                                <option value="" selected disabled>
                                    Select book status
                                </option>

                                <option value="Available">
                                    Available
                                </option>

                                <option value="Reserved">
                                    Reserved
                                </option>

                                <option value="Sold">
                                    Sold
                                </option>

                            </select>
                        </div>

                        <!-- Agreement -->
                        <div class="form-check mb-4">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="agree"
                                   name="agree"
                                   required>

                            <label class="form-check-label"
                                   for="agree">
                                I agree that this book information is accurate and complete
                            </label>

                        </div>

                        <!-- Submit -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">
                                Add Book
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5">
        <div class="container text-center">

            <p class="mb-0">
                &copy; 2026 BookVerse. All rights reserved.
            </p>

            <p class="mb-0">
                Created by Oliver Heberle
            </p>

        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="assets/js/scripts.js"></script>

</body>

</html>
