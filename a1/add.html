<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title shown in the browser tab -->
    <title>BookVerse | Add Book</title>

    <!-- Bootstrap CSS framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts used throughout the website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap"
          rel="stylesheet">

    <!-- Material Icons used for website icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- Custom BookVerse stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ==================== HEADER & NAVIGATION ==================== -->
    <header>
        <nav class="navbar navbar-expand-lg">

            <!-- Bootstrap container keeps the navigation content aligned -->
            <div class="container">

                <!-- BookVerse logo and link back to homepage -->
                <a class="navbar-brand" href="index.html">
                    <span class="material-icons">menu_book</span>
                    BookVerse
                </a>

                <!-- Button used to open/close the navigation menu on smaller screens -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation"
                        aria-controls="mainNavigation"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapsible navigation menu -->
                <div class="collapse navbar-collapse" id="mainNavigation">

                    <!-- Navigation links -->
                    <ul class="navbar-nav ms-auto">

                        <!-- Home page -->
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <!-- Books page -->
                        <li class="nav-item">
                            <a class="nav-link" href="books.html">
                                Books
                            </a>
                        </li>

                        <!-- Gallery page -->
                        <li class="nav-item">
                            <a class="nav-link" href="gallery.html">
                                Gallery
                            </a>
                        </li>

                        <!-- Current page is highlighted as active -->
                        <li class="nav-item">
                            <a class="nav-link active" href="add.html">
                                Add Book
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>


    <!-- ==================== MAIN CONTENT ==================== -->
    <main>

        <!-- Bootstrap container provides responsive page spacing -->
        <section class="container py-5">

            <!-- Page heading -->
            <div class="text-center mb-5">
                <h1>Add a Book</h1>
                <p>Add a new book to the BookVerse collection.</p>
            </div>

            <!-- Centre the form horizontally -->
            <div class="row justify-content-center">

                <!-- Form takes full width on small screens and 8 columns on large screens -->
                <div class="col-12 col-lg-8">

                    <!-- Add Book form -->
                    <form id="addBookForm">


                        <!-- ==================== BOOK TITLE ==================== -->
                        <div class="mb-3">

                            <!-- Label is associated with the title input using the "for" attribute -->
                            <label for="title" class="form-label">
                                Book Title
                            </label>

                            <!-- Required text input for the book title -->
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   name="title"
                                   placeholder="Enter the book title"
                                   required>
                        </div>


                        <!-- ==================== AUTHOR ==================== -->
                        <div class="mb-3">

                            <!-- Author input label -->
                            <label for="author" class="form-label">
                                Author Name
                            </label>

                            <!-- Required text input for the author's name -->
                            <input type="text"
                                   class="form-control"
                                   id="author"
                                   name="author"
                                   placeholder="Enter the author's name"
                                   required>
                        </div>


                        <!-- ==================== GENRE ==================== -->
                        <div class="mb-3">

                            <!-- Genre input label -->
                            <label for="genre" class="form-label">
                                Genre
                            </label>

                            <!-- Required text input for the book genre -->
                            <input type="text"
                                   class="form-control"
                                   id="genre"
                                   name="genre"
                                   placeholder="Enter the book genre"
                                   required>
                        </div>


                        <!-- ==================== PUBLICATION YEAR ==================== -->
                        <div class="mb-3">

                            <!-- Publication year label -->
                            <label for="publication_year" class="form-label">
                                Publication Year
                            </label>

                            <!-- Number input for the book's publication year -->
                            <input type="number"
                                   class="form-control"
                                   id="publication_year"
                                   name="publication_year"
                                   placeholder="Enter the publication year"
                                   required>
                        </div>


                        <!-- ==================== ISBN ==================== -->
                        <div class="mb-3">

                            <!-- ISBN input label -->
                            <label for="isbn" class="form-label">
                                ISBN
                            </label>

                            <!-- Required text input for the ISBN -->
                            <input type="text"
                                   class="form-control"
                                   id="isbn"
                                   name="isbn"
                                   placeholder="Enter the ISBN"
                                   required>
                        </div>


                        <!-- ==================== DESCRIPTION ==================== -->
                        <div class="mb-3">

                            <!-- Description field label -->
                            <label for="description" class="form-label">
                                Description
                            </label>

                            <!-- Textarea allows the user to enter a longer description -->
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="5"
                                      placeholder="Enter a description of the book"
                                      required></textarea>
                        </div>


                        <!-- ==================== BOOK CONDITION ==================== -->
                        <div class="mb-3">

                            <!-- Condition dropdown label -->
                            <label for="book_condition" class="form-label">
                                Book Condition
                            </label>

                            <!-- Dropdown containing the available book conditions -->
                            <select class="form-select"
                                    id="book_condition"
                                    name="book_condition"
                                    required>

                                <!-- Placeholder option -->
                                <option value="" selected disabled>
                                    Select book condition
                                </option>

                                <!-- New book option -->
                                <option value="New">
                                    New
                                </option>

                                <!-- Gently used book option -->
                                <option value="Gently Used">
                                    Gently Used
                                </option>

                                <!-- Fair condition option -->
                                <option value="Fair">
                                    Fair
                                </option>

                            </select>
                        </div>


                        <!-- ==================== PRICE ==================== -->
                        <div class="mb-3">

                            <!-- Price input label -->
                            <label for="price" class="form-label">
                                Price
                            </label>

                            <!-- Number input allowing prices with two decimal places -->
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   name="price"
                                   placeholder="Enter the price"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>


                        <!-- ==================== COVER IMAGE ==================== -->
                        <div class="mb-3">

                            <!-- File upload label -->
                            <label for="image_path" class="form-label">
                                Upload Cover Image
                            </label>

                            <!--
                                File input for the book cover.
                                The accept attribute limits the selectable file types.
                                JavaScript also validates the extension.
                            -->
                            <input type="file"
                                   class="form-control"
                                   id="image_path"
                                   name="image_path"
                                   accept=".jpg,.jpeg,.png,.gif,.webp"
                                   required>

                            <!-- Tell the user which image formats are accepted -->
                            <div class="form-text">
                                Accepted image types: JPG, JPEG, PNG, GIF and WEBP.
                            </div>
                        </div>


                        <!-- ==================== IMAGE PREVIEW ==================== -->
                        <div class="mb-4 text-center">

                            <!--
                                Image preview is initially hidden using Bootstrap's d-none class.
                                JavaScript displays this image after a valid file is selected.
                            -->
                            <img id="imagePreview"
                                 src=""
                                 alt="Selected book cover preview"
                                 class="img-fluid d-none">
                        </div>


                        <!-- ==================== BOOK STATUS ==================== -->
                        <div class="mb-3">

                            <!-- Status dropdown label -->
                            <label for="status" class="form-label">
                                Status
                            </label>

                            <!-- Dropdown for selecting the book's current status -->
                            <select class="form-select"
                                    id="status"
                                    name="status"
                                    required>

                                <!-- Placeholder option -->
                                <option value="" selected disabled>
                                    Select book status
                                </option>

                                <!-- Available status -->
                                <option value="Available">
                                    Available
                                </option>

                                <!-- Reserved status -->
                                <option value="Reserved">
                                    Reserved
                                </option>

                                <!-- Sold status -->
                                <option value="Sold">
                                    Sold
                                </option>

                            </select>
                        </div>


                        <!-- ==================== AGREEMENT ==================== -->
                        <div class="form-check mb-4">

                            <!--
                                Required checkbox.
                                The form cannot be submitted unless the user agrees
                                that the information entered is accurate.
                            -->
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="agree"
                                   name="agree"
                                   required>

                            <!-- Checkbox label -->
                            <label class="form-check-label"
                                   for="agree">
                                I agree that this book information is accurate and complete
                            </label>

                        </div>


                        <!-- ==================== SUBMIT BUTTON ==================== -->
                        <div class="d-grid">

                            <!-- Submit button for the Add Book form -->
                            <button type="submit"
                                    class="btn btn-primary">
                                Add Book
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer class="py-4 mt-5">

        <div class="container text-center">

            <!-- Copyright information -->
            <p class="mb-0">
                &copy; 2026 BookVerse. All rights reserved.
            </p>

            <!-- Student/project attribution -->
            <p class="mb-0">
                Created by Oliver Heberle
            </p>

        </div>
    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

    <!-- Bootstrap JavaScript bundle provides components such as the mobile navbar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript for form validation and image preview -->
    <script src="assets/js/scripts.js"></script>

</body>

</html>
