         tabindex="-1"
         aria-labelledby="imageModalLabel"
         aria-hidden="true">

                <!-- Modal header -->

                    <h2 class="modal-title fs-5"
                        id="imageModalLabel">

                        Book Cover

                    </h2>


                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <!-- Modal image -->

                         src=""
                         class="img-fluid"
