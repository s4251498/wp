<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookVerse | Gallery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap"
          rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


    <!-- ==================== HEADER & NAVIGATION ==================== -->

    <header>

        <nav class="navbar navbar-expand-lg">

            <div class="container">

                <!-- BookVerse logo -->

                <a class="navbar-brand"
                   href="index.html">

                    <span class="material-icons">
                        menu_book
                    </span>

                    BookVerse

                </a>


                <!-- Mobile navigation button -->

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation"
                        aria-controls="mainNavigation"
                        aria-expanded="false"
                        aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <!-- Navigation links -->

                <div class="collapse navbar-collapse"
                     id="mainNavigation">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">

                            <a class="nav-link"
                               href="index.html">

                                Home

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link"
                               href="books.html">

                                Books

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link active"
                               href="gallery.html">

                                Gallery

                            </a>

                        </li>


                        <li class="nav-item">

                            <a class="nav-link"
                               href="add.html">

                                Add Book

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <!-- ==================== MAIN CONTENT ==================== -->

    <main>

        <section class="container py-5">


            <!-- ==================== PAGE HEADING ==================== -->

            <div class="mb-4">

                <h1>

                    <span class="material-icons text-success align-middle">
                        collections
                    </span>

                    Book Gallery

                </h1>

                <p class="text-light">
                    Explore the BookVerse collection.
                </p>

            </div>


            <!-- ==================== GALLERY GRID ==================== -->

            <div class="row g-3">


                <!-- Book 1 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/1.png"
                            data-title="The Midnight Library"
                            data-index="0">

                        <img src="assets/images/covers/1.png"
                             class="img-fluid gallery-image"
                             alt="The Midnight Library">

                    </button>

                </div>


                <!-- Book 2 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/2.png"
                            data-title="Project Hail Mary"
                            data-index="1">

                        <img src="assets/images/covers/2.png"
                             class="img-fluid gallery-image"
                             alt="Project Hail Mary">

                    </button>

                </div>


                <!-- Book 3 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/3.png"
                            data-title="Dune"
                            data-index="2">

                        <img src="assets/images/covers/3.png"
                             class="img-fluid gallery-image"
                             alt="Dune">

                    </button>

                </div>


                <!-- Book 4 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/4.png"
                            data-title="The Hobbit"
                            data-index="3">

                        <img src="assets/images/covers/4.png"
                             class="img-fluid gallery-image"
                             alt="The Hobbit">

                    </button>

                </div>


                <!-- Book 5 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/5.png"
                            data-title="1984"
                            data-index="4">

                        <img src="assets/images/covers/5.png"
                             class="img-fluid gallery-image"
                             alt="1984">

                    </button>

                </div>


                <!-- Book 6 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/6.png"
                            data-title="Pride and Prejudice"
                            data-index="5">

                        <img src="assets/images/covers/6.png"
                             class="img-fluid gallery-image"
                             alt="Pride and Prejudice">

                    </button>

                </div>


                <!-- Book 7 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/7.png"
                            data-title="To Kill a Mockingbird"
                            data-index="6">

                        <img src="assets/images/covers/7.png"
                             class="img-fluid gallery-image"
                             alt="To Kill a Mockingbird">

                    </button>

                </div>


                <!-- Book 8 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/8.png"
                            data-title="The Great Gatsby"
                            data-index="7">

                        <img src="assets/images/covers/8.png"
                             class="img-fluid gallery-image"
                             alt="The Great Gatsby">

                    </button>

                </div>


                <!-- Book 9 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/9.png"
                            data-title="Educated"
                            data-index="8">

                        <img src="assets/images/covers/9.png"
                             class="img-fluid gallery-image"
                             alt="Educated">

                    </button>

                </div>


                <!-- Book 10 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/10.png"
                            data-title="The Seven Husbands"
                            data-index="9">

                        <img src="assets/images/covers/10.png"
                             class="img-fluid gallery-image"
                             alt="The Seven Husbands">

                    </button>

                </div>


                <!-- Book 11 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/11.png"
                            data-title="Atomic Habits"
                            data-index="10">

                        <img src="assets/images/covers/11.png"
                             class="img-fluid gallery-image"
                             alt="Atomic Habits">

                    </button>

                </div>


                <!-- Book 12 -->

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/12.png"
                            data-title="Sapiens"
                            data-index="11">

                        <img src="assets/images/covers/12.png"
                             class="img-fluid gallery-image"
                             alt="Sapiens">

                    </button>

                </div>


            </div>

        </section>

    </main>


    <!-- ==================== IMAGE MODAL ==================== -->

    <div class="modal fade"
         id="imageModal"
         tabindex="-1"
         aria-labelledby="imageModalLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">


                <!-- Modal header -->

                <div class="modal-header">

                    <h2 class="modal-title fs-5"
                        id="imageModalLabel">

                        Book Cover

                    </h2>


                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <!-- Modal image -->

                <div class="modal-body text-center">

                    <img id="modalImage"
                         src=""
                         class="img-fluid"
                         alt="Selected book cover">

                </div>


                <!-- Modal navigation -->

                <div class="modal-footer">

                    <button type="button"
                            id="previousImage"
                            class="btn btn-secondary">

                        &lt; Previous

                    </button>


                    <button type="button"
                            id="nextImage"
                            class="btn btn-primary">

                        Next &gt;

                    </button>

                </div>


            </div>

        </div>

    </div>


    <!-- ==================== FOOTER ==================== -->

    <footer class="py-4 mt-5">

        <div class="container text-center">

            <p class="mb-0">
                &copy; 2026 BookVerse. All rights reserved.
            </p>

            <p class="mb-0">
                Created by Oliver Heberle
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->

    <script src="assets/js/scripts.js"></script>

</body>

</html>
