<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding -->
    <meta charset="UTF-8">

    <!-- Make the website responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title shown in the browser tab -->
    <title>BookVerse | Gallery</title>

    <!-- Bootstrap CSS framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts used throughout the website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap"
          rel="stylesheet">

    <!-- Material Icons used for website icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <!-- Custom BookVerse CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ==================== HEADER & NAVIGATION ==================== -->
    <header>
        <nav class="navbar navbar-expand-lg">

            <!-- Bootstrap container keeps the navigation content aligned -->
            <div class="container">

                <!-- BookVerse logo links back to the homepage -->
                <a class="navbar-brand" href="index.html">
                    <span class="material-icons">menu_book</span>
                    BookVerse
                </a>

                <!--
                    Mobile navigation button.
                    Bootstrap's collapse component hides the navigation
                    links on smaller screens.
                -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavigation"
                        aria-controls="mainNavigation"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- ==================== NAVIGATION LINKS ==================== -->
                <div class="collapse navbar-collapse" id="mainNavigation">

                    <!-- Navigation links aligned to the right -->
                    <ul class="navbar-nav ms-auto">

                        <!-- Home page -->
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>

                        <!-- Books page -->
                        <li class="nav-item">
                            <a class="nav-link" href="books.html">
                                Books
                            </a>
                        </li>

                        <!-- Current page is marked as active -->
                        <li class="nav-item">
                            <a class="nav-link active" href="gallery.html">
                                Gallery
                            </a>
                        </li>

                        <!-- Add Book page -->
                        <li class="nav-item">
                            <a class="nav-link" href="add.html">
                                Add Book
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>


    <!-- ==================== MAIN CONTENT ==================== -->

                <h1>Book Gallery</h1>
                <p>Explore the BookVerse collection.</p>
            </div>


            <!-- ==================== GALLERY GRID ==================== -->

            <!--
                Bootstrap row creates the responsive gallery layout.
                The g-4 class adds spacing between gallery items.
            -->
            <div class="row g-4">


                <!-- ==================== BOOK IMAGE 1 ==================== -->

                <!--
                    Bootstrap responsive columns:
                    - col-12: 1 image per row on very small screens
                    - col-sm-6: 2 images per row on small screens
                    - col-md-4: 3 images per row on medium screens
                    - col-lg-3: 4 images per row on large screens
                -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <!--
                        Clicking the image opens the Bootstrap modal.
                        data-image and data-title are read by JavaScript
                        to determine which image and title to display.
                    -->
                    <button type="button"
                            class="gallery-image-button"
                            data-bs-toggle="modal"
                            data-bs-target="#imageModal"
                            data-image="assets/images/covers/1.png"
                            data-title="Book cover 1">

                        <!-- Responsive book cover image -->
                        <img src="assets/images/covers/1.png"
                             class="img-fluid gallery-image"
                             alt="Book cover 1">

                    </button>
                </div>

    </main>


    <!-- ==================== BOOTSTRAP IMAGE MODAL ==================== -->

    <!--
        Bootstrap modal used to display a larger version of
        the selected book cover.
    -->
    <div class="modal fade"
         id="imageModal"
         tabindex="-1"
         aria-labelledby="imageModalLabel"
         aria-hidden="true">

        <!--
            modal-lg makes the modal larger on desktop.
            modal-dialog-centered vertically centres it on the page.
        -->
        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <!-- Modal header contains the title and close button -->
                <div class="modal-header">

                    <!--
                        JavaScript can update this title when
                        a gallery image is selected.
                    -->
                    <h2 class="modal-title fs-5" id="imageModalLabel">
                        Book Cover
                    </h2>

                    <!-- Bootstrap close button -->
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <!-- ==================== MODAL IMAGE ==================== -->
                <div class="modal-body text-center">

                    <!--
                        JavaScript changes the src attribute of this image
                        to the selected gallery image.
                    -->
                    <img id="modalImage"
                         src=""
                         class="img-fluid"
                         alt="Selected book cover">

                </div>

            </div>

        </div>

    </div>


    <!-- ==================== FOOTER ==================== -->
    <footer class="py-4 mt-5">

        <div class="container text-center">

            </p>

            </p>

    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

    <!--
        Bootstrap JavaScript bundle provides functionality
        for the responsive navbar and image modal.
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!--
        Custom JavaScript handles the gallery image selection
        and updates the Bootstrap modal.
    -->
    <script src="assets/js/scripts.js"></script>

</body>

</html>
